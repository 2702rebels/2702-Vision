name: Manually created caching

on:
  workflow_dispatch:

jobs:
  upload-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          submodules: none

      - name: Fetch vcpkg submodule
        run: git submodule update --init --recursive vcpkg

      - name: Download cache artifact
        uses: actions/download-artifact@v4
        with:
          name: premade-cache
          path: download-folder

      - name: Unzip cache
        run: |
          mkdir -p archives
          unzip download-folder/*.zip -d archives

      - name: Upload cache
        uses: actions/cache@v4
        with:
          path: archives/
          key: vcpkg-${{hashFiles('vcpkg.json')}}-${{hashFiles('vcpkg/**')}}
          restore-keys: |
            vcpkg-