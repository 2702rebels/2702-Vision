name: autoformat
on:
  pull_request:
    branches-ignore:
      - "terry-jetson"
  push:
    branches: [main]
jobs:
  clang-format:
    #runs-on: ubuntu-latest
    runs-on: [self-hosted, linux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{github.event.pull_request.head.repo.full_name}}
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run clang-format
        run: |
          FILES=$(find . -type f -regex '\./\(2025\|Utilities\|tests\|calibrationdevice\)/.*\.\(h\|cpp\)$')
          
          clang-format -i $FILES

      - name: Create diff
        run: |
          if ! git diff --quiet; then
            git diff > clang-format.patch
            echo "Patch created, apply the patch from the action artifact to fix"
          else
            echo "No changes required"
          fi

      - name: Upload patch if exists
        uses: actions/upload-artifact@v4
        if: ${{hashFiles('clang-format.patch') != ''}}
        with:
          path: clang-format.patch
          name: clang-format.patch

      - name: Fail if patch exists
        if: ${{hashFiles('clang-format.patch') != ''}}
        run: |
          exit 1