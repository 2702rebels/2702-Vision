name: Deploy Doxygen Docs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required so we can push to gh-pages

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Build docs
        run: doxygen

      - name: Deploy to gh-pages
        run: |
          # Configure git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Switch to gh-pages branch (create if missing)
          git checkout gh-pages || git checkout --orphan gh-pages

          # Remove old docs
          git rm -rf . || true

          # Copy new docs
          cp -r docs/html/* .

          # Commit and push
          git add .
          git commit -m "Update Doxygen docs for commit ${{ github.sha }}" || true
          git push origin gh-pages --force
